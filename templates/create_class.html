{% extends "base.html" %}
{% block title %}Create Class{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:580px;">
    <h2>🏫 Create a New Class</h2>
    <p style="color:var(--text-light);margin-bottom:1.5rem;">A unique <strong>Join Code</strong> will be generated automatically. Share it with your students so they can enroll.</p>
    <form method="POST">
        <div class="form-group">
            <label>Class Name</label>
            <input type="text" name="class_name" required placeholder="e.g., Class 10-A, CS-101, Biology Batch 2">
        </div>
        <div class="form-group">
            <label>Description <span style="font-weight:400;color:var(--text-light)">(optional)</span></label>
            <textarea name="description" rows="3" placeholder="Brief description of this class..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Create Class &amp; Get Join Code</button>
        <a href="{{ url_for('teacher_classes') }}" class="btn btn-secondary" style="margin-left:0.75rem;">Cancel</a>
    </form>
</div>
{% endblock %}
