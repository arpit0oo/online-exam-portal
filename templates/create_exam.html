{% extends "base.html" %}
{% block title %}Create Exam{% endblock %}
{% block content %}
<div class="form-card">
    <h2>➕ Create New Exam</h2>
    <form method="POST">
        <div class="form-group">
            <label>Exam Title</label>
            <input type="text" name="title" required placeholder="e.g., Mid-Term Mathematics">
        </div>
        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" required placeholder="e.g., Mathematics">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Duration (minutes)</label>
                <input type="number" name="duration" required min="1" value="30">
            </div>
            <div class="form-group">
                <label>Total Marks</label>
                <input type="number" name="total_marks" required min="1" value="100">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Create Exam & Add Questions</button>
    </form>
</div>
{% endblock %}
